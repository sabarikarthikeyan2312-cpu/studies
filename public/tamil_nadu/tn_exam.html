
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TN Government Exam Search</title>

    <!-- React -->
    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>

    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Babel for JSX -->
    <script
        src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
        }


        /* HEADER */

        header {
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e40af
            );

            color: white;
            padding: 25px;
        }


        .header-container {
            max-width: 1200px;
            margin: auto;
        }


        .logo {
            text-align: center;
            margin-bottom: 20px;
        }


        .logo h1 {
            font-size: 30px;
        }


        .logo p {
            margin-top: 8px;
            color: #cbd5e1;
        }


        /* SEARCH */

        .search-container {
            display: flex;
            max-width: 800px;
            margin: auto;
        }


        .search-container input {
            flex: 1;
            padding: 15px;
            border: none;
            font-size: 16px;
            outline: none;
            border-radius: 8px 0 0 8px;
        }


        .search-container button {
            padding: 15px 30px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
        }


        .search-container button:hover {
            background: #1d4ed8;
        }


        /* MAIN */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }


        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }


        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }


        .welcome p {
            color: #64748b;
        }


        /* FILTER */

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }


        .filters select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }


        /* RESULTS */

        .result-count {
            margin-bottom: 20px;
            font-weight: bold;
            color: #475569;
        }


        .results {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 20px;
        }


        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            border: 1px solid #e2e8f0;

            transition: 0.2s;
        }


        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 20px
                rgba(0, 0, 0, 0.12);
        }


        .badge {
            display: inline-block;

            background: #dbeafe;
            color: #1d4ed8;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;

            margin-bottom: 12px;
        }


        .card h3 {
            margin-bottom: 12px;
            font-size: 21px;
        }


        .description {
            color: #64748b;
            line-height: 1.6;
        }


        .label {
            font-weight: bold;

            margin-top: 18px;
            margin-bottom: 7px;
        }


        .qualification {
            background: #ecfdf5;
            color: #047857;

            padding: 10px;

            border-radius: 7px;
        }


        ul {
            padding-left: 20px;
            color: #475569;
        }


        li {
            margin-bottom: 5px;
        }


        .official-link {
            display: inline-block;

            margin-top: 18px;

            padding: 10px 15px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            border-radius: 7px;
        }


        .official-link:hover {
            background: #1d4ed8;
        }


        /* NO RESULTS */

        .no-results {
            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 12px;

            grid-column: 1 / -1;
        }


        /* ROADMAP */

        .section {
            margin-top: 45px;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);
        }


        .section h2 {
            margin-bottom: 20px;
        }


        .roadmap-item {
            padding: 15px;

            border-bottom:
                1px solid #e2e8f0;
        }


        .roadmap-item:last-child {
            border-bottom: none;
        }


        .roadmap-item strong {
            color: #1d4ed8;
        }


        /* FOOTER */

        footer {
            background: #0f172a;

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 50px;
        }


        footer p {
            margin-bottom: 10px;
            color: #cbd5e1;
        }


        /* MOBILE */

        @media(max-width: 600px) {

            .search-container {
                flex-direction: column;
            }


            .search-container input {
                border-radius: 8px;
            }


            .search-container button {
                border-radius: 8px;
                margin-top: 10px;
            }


            .logo h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <!-- React App -->
    <div id="root"></div>


    <script type="text/babel">

        const { useState } = React;


        /* TN GOVERNMENT EXAM DATA */

        const examData = [

            {
                id: 1,

                ],

                ],

            },


            {

                qualification:

                ],

                ],

                website:
                    "https://www.tnpsc.gov.in/"
            },


            {

                qualification:
                    "Diploma / ITI",

                posts: [

                ],

                selection: [

                ],

                website:
                    "https://www.tnpsc.gov.in/"
            },


            {
                id: 6,

                category: "Teacher",

                title:
                    "TNTET Paper I",

                description:
                    "Generally connected with eligibility to teach Classes I to V.",

                qualification:
                    "Teacher Education",

                posts: [
                    "Primary Teacher Eligibility"
                ],

                selection: [

            {

                ],

                selection: [
                    "Teacher Eligibility Test"
                ],

                website:
                    "https://www.trb.tn.gov.in/"
            },


            {
                id: 8,

                category: "Teacher",

                title:
                    "Graduate / PG Assistant",

                description:
                    "School teacher recruitment requiring relevant qualifications.",

                qualification:
                    "Degree and Teacher Education",

                posts: [
                    "Graduate Teacher",
                    "PG Assistant"
                ],

                selection: [
                    "According to recruitment notification"
                ],

                website:
                    "https://www.trb.tn.gov.in/"
            },


            {
                id: 9,

                category: "Police",

                title:
                    "TNUSRB Police Constable",

                description:
                    "Police recruitment for eligible candidates.",

                qualification:
                    "Usually SSLC / Class 10",

                posts: [
                    "Police Constable"
                ],

                selection: [
                    "Written Examination",
                    "Tamil Eligibility Test where prescribed",
                    "Physical Measurement",
                    "Physical Efficiency Test",
                    "Medical Examination",
                    "Certificate Verification"
                ],

                website:
                    "https://www.tnusrb.tn.gov.in/"
            },


            {
                id: 10,

                category: "Police",

                title:
                    "TNUSRB Jail Warder and Fireman",

                description:
                    "Uniformed-service recruitment with physical and medical standards.",

                qualification:
                    "Usually School Level Eligibility",

                posts: [
                    "Jail Warder",
                    "Fireman"
                ],

                selection: [
                    "Written Examination",
                    "Physical Tests",
                    "Medical Examination",
                    "Certificate Verification"
                ],

                website:
                    "https://www.tnusrb.tn.gov.in/"
            },


            {
                id: 11,

                category: "Police",

                title:
                    "TNUSRB Sub-Inspector",

                description:
                    "Sub-Inspector recruitment subject to the current notification.",

                qualification:
                    "Usually Graduation",

                posts: [
                    "Sub-Inspector"
                ],

                selection: [
                    "Written Examination",
                    "Tamil Eligibility Test",
                    "Physical Measurement",
                    "Physical Efficiency Test",
                    "Medical Examination"
                ],

                website:
                    "https://www.tnusrb.tn.gov.in/"
            },


            {
                id: 12,

                category: "Medical",

                title:
                    "MRB Assistant Surgeon",

                description:
                    "Tamil Nadu medical recruitment for doctors.",

                qualification:
                    "MBBS or Higher Medical Qualification",

                posts: [
                    "Assistant Surgeon",
                    "Specialist Doctor"
                ],

                selection: [
                    "Written Examination or method stated in notification",
                    "Document Verification"
                ],

                website:
                    "https://mrb.tn.gov.in/"
            },


            {
                id: 13,

                category: "Medical",

                title:
                    "MRB Staff Nurse",

                description:
                    "Government healthcare recruitment for qualified nursing professionals.",

                qualification:
                    "Nursing Qualification and Registration",

                posts: [
                    "Staff Nurse"
                ],

                selection: [
                    "According to recruitment notification"
                ],

                website:
                    "https://mrb.tn.gov.in/"
            },


            {
                id: 14,

                category: "Medical",

                title:
                    "MRB Technical Healthcare Posts",

                description:
                    "Technical and allied healthcare recruitment.",

                qualification:
                    "Relevant Diploma / Degree",

                posts: [
                    "Pharmacist",
                    "Laboratory Technician",
                    "Health Inspector",
                    "Physiotherapist"
                ],

                selection: [
                    "Written Examination",
                    "Document Verification"
                ],

                website:
                    "https://mrb.tn.gov.in/"
            },


            {
                id: 15,

                category: "Electricity",

                title:
                    "TANGEDCO / TANTRANSCO Recruitment",

                description:
                    "Electricity distribution and transmission recruitment when vacancies arise.",

                qualification:
                    "Depends on Notified Post",

                posts: [
                    "Engineer",
                    "Technician",
                    "Apprentice",
                    "Other Staff"
                ],

                selection: [
                    "According to recruitment notification"
                ],

                website:
                    "https://www.tangedco.gov.in/"
            },


            {
                id: 16,

                category: "Courts",

                title:
                    "Tamil Nadu Courts Recruitment",

                description:
                    "Court and department-specific recruitment.",

                qualification:
                    "Depends on Notified Post",

                posts: [
                    "Assistant",
                    "Typist",
                    "Stenographer",
                    "Examiner",
                    "Office Staff"
                ],

                selection: [
                    "According to department notification"
                ],

                website:
                    ""
            }

        ];


        function App() {

            const [search, setSearch] =
                useState("");

            const [category, setCategory] =
                useState("All");


            const filteredData =
                examData.filter((item) => {

                    const searchableText = (

                        item.title + " " +
                        item.category + " " +
                        item.description + " " +
                        item.qualification + " " +
                        item.posts.join(" ")

                    ).toLowerCase();


                    const searchMatch =
                        searchableText.includes(
                            search.toLowerCase()
                        );


                    const categoryMatch =
                        category === "All" ||
                        item.category === category;


                    return (
                        searchMatch &&
                        categoryMatch
                    );

                });


            return (

                <div>

                    <header>

                        <div className="header-container">

                            <div className="logo">

                                <h1>
                                    Tamil Nadu Government Job Exams
                                </h1>

                                <p>
                                    Search Government Exams and Jobs
                                </p>

                            </div>


                            <div className="search-container">

                                <input
                                    type="text"

                                    placeholder="Search TNPSC, Group IV, Police, Teacher, Medical..."

                                    value={search}

                                    onChange={(e) =>
                                        setSearch(
                                            e.target.value
                                        )
                                    }
                                />


                                <button
                                    onClick={() =>
                                        document
                                            .getElementById("results")
                                            .scrollIntoView({
                                                behavior: "smooth"
                                            })
                                    }
                                >
                                    Search
                                </button>

                            </div>

                        </div>

                    </header>


                    <main>

                        <section className="welcome">

                            <h2>
                                Find Your Government Exam
                            </h2>

                            <p>
                                Search Tamil Nadu government
                                recruitment exams, qualifications,
                                posts and official websites.
                            </p>

                        </section>


                        <div className="filters">

                            <select
                                value={category}

                                onChange={(e) =>
                                    setCategory(
                                        e.target.value
                                    )
                                }
                            >

                                <option value="All">
                                    All Categories
                                </option>

                                <option value="TNPSC">
                                    TNPSC
                                </option>

                                <option value="Technical">
                                    Technical
                                </option>

                                <option value="Teacher">
                                    Teacher
                                </option>

                                <option value="Police">
                                    Police
                                </option>

                                <option value="Medical">
                                    Medical
                                </option>

                                <option value="Electricity">
                                    Electricity
                                </option>

                                <option value="Courts">
                                    Courts
                                </option>

                            </select>

                        </div>


                        <div
                            id="results"
                            className="result-count"
                        >

                            Showing {filteredData.length} result(s)

                        </div>


                        <div className="results">

                            {
                                filteredData.length === 0

                                ?

                                <div className="no-results">

                                    <h2>
                                        No Results Found
                                    </h2>

                                    <p>
                                        Try TNPSC, Group IV, Police,
                                        Teacher, Medical or Technical.
                                    </p>

                                </div>

                                :

                                filteredData.map((item) => (

                                    <div
                                        className="card"
                                        key={item.id}
                                    >

                                        <div className="badge">
                                            {item.category}
                                        </div>


                                        <h3>
                                            {item.title}
                                        </h3>


                                        <p className="description">
                                            {item.description}
                                        </p>


                                        <div className="label">
                                            Qualification
                                        </div>


                                        <div className="qualification">
                                            {item.qualification}
                                        </div>


                                        <div className="label">
                                            Important Posts
                                        </div>


                                        <ul>

                                            {
                                                item.posts.map(
                                                    (post, index) => (

                                                        <li key={index}>
                                                            {post}
                                                        </li>

                                                    )
                                                )
                                            }

                                        </ul>


                                        <div className="label">
                                            Selection Process
                                        </div>


                                        <ul>

                                            {
                                                item.selection.map(
                                                    (step, index) => (

                                                        <li key={index}>
                                                            {step}
                                                        </li>

                                                    )
                                                )
                                            }

                                        </ul>


                                        {
                                            item.website !== ""

                                            &&

                                            <a
                                                className="official-link"

                                                href={item.website}

                                                target="_blank"

                                                rel="noopener noreferrer"
                                            >
                                                Official Website
                                            </a>
                                        }

                                    </div>

                                ))
                            }

                        </div>


                        <section className="section">

                            <h2>
                                Qualification Roadmap
                            </h2>


                            <div className="roadmap-item">

                                <strong>
                                    Class 10 / SSLC
                                </strong>

                                <p>
                                    TNPSC Group IV, TNUSRB
                                    Constable, Jail Warder,
                                    Fireman and technical posts.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    Class 12
                                </strong>

                                <p>
                                    Selected clerical, technical
                                    and department posts.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    Graduation
                                </strong>

                                <p>
                                    TNPSC Group I, Group II / IIA,
                                    TNUSRB Sub-Inspector and many
                                    teacher and department posts.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    Diploma / ITI
                                </strong>

                                <p>
                                    TNPSC technical services,
                                    electricity technical jobs,
                                    technician and apprentice posts.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    B.Ed. / D.El.Ed.
                                </strong>

                                <p>
                                    TNTET and teacher recruitment,
                                    subject to exact rules.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    Engineering Degree
                                </strong>

                                <p>
                                    TNPSC technical services and
                                    electricity engineering posts.
                                </p>

                            </div>


                            <div className="roadmap-item">

                                <strong>
                                    Medical Qualification
                                </strong>

                                <p>
                                    MRB healthcare and
                                    Assistant Surgeon recruitment.
                                </p>

                            </div>

                        </section>


                        <section className="section">

                            <h2>
                                Application Checklist
                            </h2>


                            <ul>

                                <li>
                                    Check the latest official
                                    notification.
                                </li>

                                <li>
                                    Confirm age, qualification,
                                    Tamil-language rules and
                                    other eligibility requirements.
                                </li>

                                <li>
                                    Keep certificates and identity
                                    documents ready.
                                </li>

                                <li>
                                    Download the official syllabus
                                    and previous question papers.
                                </li>

                                <li>
                                    Prepare early for physical tests
                                    where required.
                                </li>

                                <li>
                                    Monitor the official website
                                    after applying.
                                </li>

                            </ul>

                        </section>

                    </main>


                    <footer>

                        <p>
                            Important: Always verify vacancies,
                            age limits, qualifications, syllabus
                            and exam dates through the latest
                            official notification.
                        </p>


                        <p>
                            TNPSC | TRB | TNUSRB | MRB | TANGEDCO
                        </p>

                    </footer>

                </div>

            );

        }


        const root =
            ReactDOM.createRoot(
                document.getElementById("root")
            );


        root.render(
            <App />
        );

    </script>

</body>
</html>
