<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tamil Nadu UG Admissions Index — 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A38;
    --paper:#EEE9DA;
    --paper-raised:#F6F2E7;
    --marigold:#CE8F1F;
    --brick:#95392B;
    --teal:#2E6459;
    --muted:#69624F;
    --line:#c9c0a6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:920px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- Header / letterhead ---------- */
  .letterhead{
    padding:48px 0 28px;
    border-bottom:2px solid var(--ink);
    margin-bottom:36px;
  }
  .letterhead-top{
    display:flex;
    align-items:flex-start;
    gap:18px;
  }
  .emblem{flex:none;width:52px;height:52px;margin-top:4px;}
  .letterhead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px,4.2vw,42px);
    line-height:1.08;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .letterhead .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--brick);
    margin:0 0 10px;
  }
  .letterhead p.sub{
    max-width:56ch;
    margin:0;
    color:var(--muted);
    font-size:15.5px;
    line-height:1.55;
  }
  .verified-badge{
    margin-top:18px;
    display:inline-flex;
    gap:8px;
    align-items:center;
    font-size:12.5px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--teal);
    border:1px solid var(--teal);
    padding:5px 10px;
    border-radius:2px;
  }
  .verified-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:8px;
  }
  .search-wrap{
    flex:1 1 220px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    padding:10px 12px 10px 34px;
    border:1.5px solid var(--ink);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:2px;
  }
  .search-wrap input::placeholder{color:#8a8368;}
  .search-wrap svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--muted);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 34px;}
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:7px 12px;
    border:1.3px solid var(--ink);
    background:transparent;
    color:var(--ink);
    border-radius:2px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .chip:hover{background:rgba(30,42,56,0.06);}
  .chip.active{background:var(--ink);color:var(--paper);}

  .result-count{
    font-size:13px;
    color:var(--muted);
    margin:0 0 16px;
  }

  /* ---------- Ticket card ---------- */
  .tickets{display:flex;flex-direction:column;gap:22px;}
  .ticket{
    display:flex;
    background:var(--paper-raised);
    border:1.6px solid var(--ink);
    position:relative;
  }
  .stub{
    flex:none;
    width:132px;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:repeating-linear-gradient(135deg, transparent 0 8px, rgba(30,42,56,0.035) 8px 16px);
  }
  .stub-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brick);
  }
  .stub-stream{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    line-height:1.25;
    margin-top:14px;
    color:var(--ink);
  }
  .perforation{
    flex:none;
    width:0;
    border-left:2px dashed var(--line);
    position:relative;
    margin:14px 0;
  }
  .perforation::before,.perforation::after{
    content:"";
    position:absolute;
    left:-9px;
    width:18px;height:18px;
    background:var(--paper);
    border-radius:50%;
    border:1.6px solid var(--ink);
  }
  .perforation::before{top:-14px;}
  .perforation::after{bottom:-14px;}
  .body{
    flex:1;
    padding:20px 22px 18px;
    min-width:0;
  }
  .body-head{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:8px 12px;
    margin-bottom:6px;
  }
  .body-head h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:0;
  }
  .authority{
    font-size:12.5px;
    color:var(--teal);
    font-weight:500;
  }
  .desc{
    font-size:14.5px;
    line-height:1.58;
    color:#3a3527;
    margin:0 0 12px;
    max-width:62ch;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .tag{
    font-size:11.5px;
    font-family:'IBM Plex Mono', monospace;
    padding:3px 8px;
    background:rgba(46,100,89,0.1);
    color:var(--teal);
    border-radius:2px;
  }
  .body-foot{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .note{font-size:12.5px;color:var(--muted);max-width:40ch;line-height:1.5;}
  .open-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--paper);
    background:var(--ink);
    padding:9px 14px;
    border-radius:2px;
    text-decoration:none;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .open-btn:hover{background:var(--brick);}
  .open-btn svg{width:13px;height:13px;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14.5px;
    border:1.5px dashed var(--line);
  }

  footer{
    margin-top:56px;
    padding-top:22px;
    border-top:2px solid var(--ink);
    font-size:12.5px;
    color:var(--muted);
    line-height:1.7;
  }
  footer strong{color:var(--ink);}

  @media (max-width:600px){
    .ticket{flex-direction:column;}
    .stub{
      width:auto;
      flex-direction:row;
      justify-content:space-between;
      align-items:center;
      padding:14px 18px;
    }
    .stub-stream{margin-top:0;text-align:right;}
    .perforation{
      width:auto;height:0;
      border-left:none;
      border-top:2px dashed var(--line);
      margin:0 14px;
    }
    .perforation::before,.perforation::after{
      left:auto;top:-9px;
    }
    .perforation::before{left:-14px;}
    .perforation::after{left:auto;right:-14px;}
    .body{padding:16px 18px 18px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const PORTALS = [
  {
    id: "tnea",
    stream: "Engineering",
    name: "TNEA",
    fullName: "Tamil Nadu Engineering Admissions",
    authority: "Directorate of Technical Education, Anna University",
    desc: "Single-window counselling for B.E. / B.Tech seats (including the integrated M.Tech CSE route) across government, government-aided and self-financing engineering colleges in Tamil Nadu, based on Class 12 marks — no separate entrance test.",
    courses: ["B.E.", "B.Tech", "Integrated M.Tech (CSE)"],
    note: "Registration usually opens in May, once Class 12 results are out.",
    url: "https://www.tneaonline.org/"
  },
  {
    id: "tngasa",
    stream: "Arts & Science",
    name: "TNGASA",
    fullName: "Tamil Nadu Government Arts & Science Colleges Admissions",
    authority: "Directorate of Collegiate Education",
    desc: "The unified portal for undergraduate seats across Tamil Nadu's government arts and science colleges — one application can be used to apply to several colleges and courses at once.",
    courses: ["B.A.", "B.Sc.", "B.Com.", "B.Lit. (Tamil)"],
    note: "Applications typically open in the first week of May.",
    url: "https://www.tngasa.in/"
  },
  {
    id: "tnmedical",
    stream: "Medical & Health",
    name: "TN Medical Selection",
    fullName: "Tamil Nadu Medical Selection Committee",
    authority: "Directorate of Medical Education & Research",
    desc: "Handles NEET-UG based counselling for MBBS, BDS and AYUSH (BAMS/BHMS/BUMS/BSMS) seats in government, deemed and private medical/dental colleges, plus allied health science courses.",
    courses: ["MBBS", "BDS", "AYUSH", "Allied Health Sciences"],
    note: "Registration opens after NEET-UG results, usually late June onward.",
    url: "https://www.tnmedicalselection.net/"
  },
  {
    id: "tndalu",
    stream: "Law",
    name: "TNDALU",
    fullName: "Tamil Nadu Dr. Ambedkar Law University",
    authority: "State law university, affiliating all TN law colleges",
    desc: "Admissions to the 5-year and 3-year LLB programmes offered by government and private law colleges affiliated to TNDALU, through the university's own entrance test and counselling.",
    courses: ["B.A. LL.B.", "B.B.A. LL.B.", "B.Com. LL.B.", "LL.B."],
    note: "5-year LLB applications generally open by April–May.",
    url: "https://www.tndalu.ac.in/"
  },
  {
    id: "tnau",
    stream: "Agriculture",
    name: "TNAU",
    fullName: "Tamil Nadu Agricultural University",
    authority: "Tamil Nadu Agricultural University, Coimbatore",
    desc: "UG admissions to agriculture, horticulture, forestry and food & agribusiness programmes across TNAU's constituent and affiliated colleges, based on Class 12 marks.",
    courses: ["B.Sc. (Agriculture)", "B.Sc. (Horticulture)", "B.Tech (Food Tech.)", "B.Sc. (Forestry)"],
    note: "See the ugadmission page for the current year's application link.",
    url: "https://tnau.ac.in/ugadmission/"
  },
  {
    id: "tanuvas",
    stream: "Veterinary & Fisheries",
    name: "TANUVAS",
    fullName: "Tamil Nadu Veterinary and Animal Sciences University",
    authority: "Tamil Nadu Veterinary & Animal Sciences University, Chennai",
    desc: "Counselling for B.V.Sc. & A.H. and related undergraduate seats in veterinary science, fisheries and food technology at TANUVAS's constituent colleges.",
    courses: ["B.V.Sc. & A.H.", "B.F.Sc.", "B.Tech (Food Tech.)"],
    note: "Counselling follows the state's merit list and reservation rules.",
    url: "https://www.tanuvas.ac.in/"
  },
  {
    id: "tnpesu",
    stream: "Sports",
    name: "TNPESU",
    fullName: "Tamil Nadu Physical Education and Sports University",
    authority: "TN Physical Education & Sports University, Chennai",
    desc: "India's first public sports university, offering undergraduate programmes in physical education, sports science and yoga, with admission based on merit and, for some courses, sporting record.",
    courses: ["B.P.Ed.", "B.Sc. (Physical Education)", "B.Sc. (Yoga)"],
    note: "Application windows are announced on the university site each year.",
    url: "https://www.tnpesu.org/"
  }
];

const STREAMS = ["All", ...Array.from(new Set(PORTALS.map(p => p.stream)))];

function SearchIcon(){
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  );
}

function ExternalIcon(){
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
      <path d="M7 17L17 7"/>
      <path d="M9 7h8v8"/>
    </svg>
  );
}

function Emblem(){
  return (
    <svg className="emblem" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="24" stroke="#1E2A38" strokeWidth="1.6"/>
      {Array.from({length:16}).map((_,i)=>{
        const angle = (i/16)*Math.PI*2;
        const x1 = 26 + Math.cos(angle)*15;
        const y1 = 26 + Math.sin(angle)*15;
        const x2 = 26 + Math.cos(angle)*20.5;
        const y2 = 26 + Math.sin(angle)*20.5;
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#CE8F1F" strokeWidth="1.6"/>;
      })}
      <circle cx="26" cy="26" r="9" fill="#95392B"/>
    </svg>
  );
}

function Ticket({ portal, index }){
  return (
    <div className="ticket">
      <div className="stub">
        <div className="stub-code">Serial No. {String(index+1).padStart(2,"0")}</div>
        <div className="stub-stream">{portal.stream}</div>
      </div>
      <div className="perforation"></div>
      <div className="body">
        <div className="body-head">
          <h3>{portal.fullName}</h3>
          <span className="authority">{portal.authority}</span>
        </div>
        <p className="desc">{portal.desc}</p>
        <div className="tags">
          {portal.courses.map(c => <span className="tag" key={c}>{c}</span>)}
        </div>
        <div className="body-foot">
          <span className="note">{portal.note}</span>
          <a className="open-btn" href={portal.url} target="_blank" rel="noopener noreferrer">
            Open {portal.name} <ExternalIcon/>
          </a>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [query, setQuery] = useState("");
  const [stream, setStream] = useState("All");

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return PORTALS.filter(p => {
      const matchesStream = stream === "All" || p.stream === stream;
      const matchesQuery = !q || [p.name,p.fullName,p.stream,p.authority,...p.courses]
        .join(" ").toLowerCase().includes(q);
      return matchesStream && matchesQuery;
    });
  }, [query, stream]);

  return (
    <React.Fragment>
      <header className="letterhead">
        <div className="letterhead-top">
          <Emblem/>
          <div>
            <p className="kicker">An independent index — not a government website</p>
            <h1>Tamil Nadu UG Admissions, 2026&ndash;27</h1>
            <p className="sub">
              Seven official counselling portals covering engineering, arts &amp; science,
              medicine, law, agriculture, veterinary science and sports — gathered in one
              place so you go straight to the source instead of a search results page.
            </p>
          </div>
        </div>
        <div className="verified-badge">
          <span className="dot"></span>
          Links checked September 2026
        </div>
      </header>

      <div className="controls">
        <div className="search-wrap">
          <SearchIcon/>
          <input
            type="text"
            placeholder="Search by course, university or stream…"
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
        </div>
      </div>

      <div className="chips">
        {STREAMS.map(s => (
          <button
            key={s}
            className={"chip" + (stream === s ? " active" : "")}
            onClick={() => setStream(s)}
          >
            {s}
          </button>
        ))}
      </div>

      <p className="result-count">
        {filtered.length} of {PORTALS.length} portals shown
      </p>

      {filtered.length > 0 ? (
        <div className="tickets">
          {filtered.map((p, i) => <Ticket portal={p} index={i} key={p.id}/>)}
        </div>
      ) : (
        <div className="empty">No portal matches that search. Try a different course or stream.</div>
      )}

      <footer>
        <strong>Before you apply:</strong> counselling dates, fees and seat numbers change
        every year and after re-tests or court orders, so treat the notes above as general
        guidance only and confirm the current schedule on each official site before paying
        any fee. This page links only to the portals run by the respective Tamil Nadu
        government departments and universities — it does not collect any of your data.
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
